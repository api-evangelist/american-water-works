  utility commission (e.g. the New Jersey BPU, the Pennsylvania PUC, the California PUC). Those
  are the price of water service to a household, not the price of programmatic access, and they
  are not modelled here: recording a residential rate schedule as an API plan would misrepresent
  both. plan_count is an honest zero.
